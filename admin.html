<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Modern Med Clinic</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#faf8f8;color:#1a1f2e;line-height:1.5}.wrap{max-width:1120px;margin:0 auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{font-family:Georgia,serif;color:#b81c1c;margin:0;font-size:2rem}.muted{color:#6b5e5e}.login,.toolbar,.card,.panel{background:#fff;border:1px solid #e4dcdc;border-radius:12px;box-shadow:0 2px 20px rgba(184,28,28,.06)}.login{max-width:430px;margin:80px auto;padding:26px}.tabs{display:flex;gap:8px;margin:0 0 18px}.tab{background:#f2eded;color:#1a1f2e}.tab.active{background:#b81c1c;color:#fff}.toolbar{padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.card{padding:18px;display:flex;flex-direction:column;gap:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.spec{font-weight:700}.date{font-size:.82rem;color:#9a8e8e}.status{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;font-weight:700}.approved{background:#e6f7ee;color:#1f7a4f}.pending{background:#fef3e0;color:#9a6500}.rejected{background:#f2eded;color:#6b5e5e}.score{display:flex;gap:8px;flex-wrap:wrap;font-size:.86rem;color:#6b5e5e}.score b{color:#b81c1c}.comment{font-style:italic;color:#3a3140;background:#faf8f8;border-radius:8px;padding:12px}.contact{font-size:.86rem;color:#6b5e5e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}button{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer;background:#b81c1c;color:#fff}button:hover{background:#d42b2b}button:disabled{opacity:.55;cursor:not-allowed}button.secondary{background:#1a1f2e}button.light{background:#f2eded;color:#1a1f2e}button.ok{background:#2d9d6a}input,select{width:100%;padding:12px 13px;border:1px solid #e4dcdc;border-radius:8px;font-size:.95rem;background:#fff}label{display:block;font-weight:700;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.empty{background:#fff;border:1px dashed #e4dcdc;border-radius:12px;padding:28px;text-align:center;color:#6b5e5e}.error,.notice{border-radius:8px;padding:10px 12px;margin-top:12px;display:none}.error{background:#fdf0f0;color:#8b1515;border:1px solid #f0c6c6}.notice{background:#eaf8f1;color:#1f6d4b;border:1px solid #c3ead6}.panel{padding:18px}.compose{display:grid;gap:14px}.compose-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar-editor{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#faf8f8;border:1px solid #e4dcdc;border-radius:8px}.toolbar-editor button{min-width:42px;padding:9px 11px;background:#fff;color:#1a1f2e;border:1px solid #e4dcdc}.editor{min-height:280px;padding:14px;border:1px solid #e4dcdc;border-radius:8px;background:#fff;outline:none}.editor:focus,input:focus,select:focus{border-color:#b81c1c;box-shadow:0 0 0 3px rgba(184,28,28,.12)}.attachments{display:grid;gap:8px}.attachments input{padding:10px;background:#faf8f8}.attachment-list{font-size:.86rem;color:#6b5e5e}.attachment-list span{display:inline-flex;margin:4px 6px 0 0;padding:5px 9px;border-radius:999px;background:#f2eded;color:#1a1f2e}.sendbar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.hidden{display:none}@media(max-width:720px){header,.toolbar{align-items:flex-start;flex-direction:column}.row,.compose-grid{grid-template-columns:1fr}.tabs{width:100%}.tab{flex:1}}
</style>
</head>
<body>
<main class="wrap">
  <section class="login" id="login">
    <h1>Admin</h1>
    <p class="muted">Introduceți parola pentru acces.</p>
    <div class="row">
      <div><label for="password">Parolă</label><input id="password" type="password" autocomplete="current-password"></div>
      <button id="loginBtn" type="button">Intră</button>
    </div>
    <div class="error" id="loginError"></div>
  </section>

  <section id="app" style="display:none">
    <header>
      <div>
        <h1>Modern Med Clinic</h1>
        <div class="muted" id="countLabel">Se încarcă...</div>
      </div>
      <button class="light" id="logoutBtn" type="button">Ieșire</button>
    </header>

    <nav class="tabs" aria-label="Meniu admin">
      <button class="tab active" data-tab="reviews" type="button">Recenzii</button>
      <button class="tab" data-tab="email" type="button">Email</button>
    </nav>

    <section id="reviewsTab">
      <div class="toolbar">
        <select id="statusFilter" aria-label="Filtru status">
          <option value="all">Toate statusurile</option>
          <option value="pending">Pending</option>
          <option value="approved">Aprobate</option>
          <option value="rejected">Respinse</option>
        </select>
        <button class="secondary" id="refreshBtn" type="button">Reîncarcă</button>
      </div>
      <div class="grid" id="reviews"></div>
    </section>

    <section class="panel hidden" id="emailTab">
      <form class="compose" id="emailForm">
        <div class="compose-grid">
          <div>
            <label for="emailFrom">De la</label>
            <select id="emailFrom">
              <option value="contact@modernmedclinic.ro">contact@modernmedclinic.ro</option>
              <option value="programari@modernmedclinic.ro">programari@modernmedclinic.ro</option>
            </select>
          </div>
          <div>
            <label for="emailTo">Către</label>
            <input id="emailTo" type="text" autocomplete="email" placeholder="nume@email.ro">
          </div>
        </div>
        <div class="compose-grid">
          <div>
            <label for="emailCc">CC</label>
            <input id="emailCc" type="text" autocomplete="email">
          </div>
          <div>
            <label for="emailBcc">BCC</label>
            <input id="emailBcc" type="text" autocomplete="email">
          </div>
        </div>
        <div>
          <label for="emailSubject">Subiect</label>
          <input id="emailSubject" type="text" autocomplete="off">
        </div>
        <div class="attachments">
          <label for="emailAttachments">Atașamente</label>
          <input id="emailAttachments" type="file" multiple>
          <div class="attachment-list" id="attachmentList">Maximum 5 fișiere, 8 MB total.</div>
        </div>
        <div>
          <label for="emailEditor">Mesaj</label>
          <div class="toolbar-editor" aria-label="Formatare email">
            <button type="button" data-command="bold"><b>B</b></button>
            <button type="button" data-command="italic"><i>I</i></button>
            <button type="button" data-command="underline"><u>U</u></button>
            <button type="button" data-command="insertUnorderedList">Listă</button>
            <button type="button" data-command="createLink">Link</button>
            <button type="button" data-command="removeFormat">Curăță</button>
          </div>
          <div class="editor" id="emailEditor" contenteditable="true" role="textbox" aria-multiline="true"></div>
        </div>
        <div class="sendbar">
          <button class="light" id="clearEmailBtn" type="button">Golește</button>
          <button id="sendEmailBtn" type="submit">Trimite email</button>
        </div>
        <div class="notice" id="emailNotice"></div>
        <div class="error" id="emailError"></div>
      </form>
    </section>
  </section>
</main>
<script>
const state={token:localStorage.getItem('mmcAdminToken')||'',reviews:[],activeTab:'reviews',attachments:[]};
const login=document.getElementById('login');
const app=document.getElementById('app');
const password=document.getElementById('password');
const loginError=document.getElementById('loginError');
const reviewsEl=document.getElementById('reviews');
const countLabel=document.getElementById('countLabel');
const statusFilter=document.getElementById('statusFilter');
const reviewsTab=document.getElementById('reviewsTab');
const emailTab=document.getElementById('emailTab');
const emailForm=document.getElementById('emailForm');
const emailEditor=document.getElementById('emailEditor');
const emailNotice=document.getElementById('emailNotice');
const emailError=document.getElementById('emailError');
const emailAttachments=document.getElementById('emailAttachments');
const attachmentList=document.getElementById('attachmentList');

function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function dateText(value){return new Date(value).toLocaleString('ro-RO',{dateStyle:'medium',timeStyle:'short'});}
function stars(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n);}
function authHeaders(){return {Authorization:'Bearer '+state.token};}
function showLoginError(message){loginError.textContent=message;loginError.style.display='block';}
function showEmailMessage(el,message){el.textContent=message;el.style.display='block';}
function resetEmailMessages(){emailNotice.style.display='none';emailError.style.display='none';}

async function api(path, options={}){
  const res=await fetch(path,{...options,headers:{...authHeaders(),...(options.headers||{})}});
  const data=await res.json().catch(()=>({}));
  if(res.status===401){localStorage.removeItem('mmcAdminToken');}
  if(!res.ok) throw new Error(data.error||'A apărut o eroare.');
  return data;
}

async function loginApi(passwordValue){
  const res=await fetch('/api/reviews/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:passwordValue})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||'Autentificare eșuată.');
  return data;
}

function setTab(tab){
  state.activeTab=tab;
  document.querySelectorAll('.tab').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tab));
  reviewsTab.classList.toggle('hidden',tab!=='reviews');
  emailTab.classList.toggle('hidden',tab!=='email');
  countLabel.textContent=tab==='reviews'?`${state.reviews.length} recenzii în total`:'Email manual';
}

function render(){
  const filter=statusFilter.value;
  const items=state.reviews.filter(r=>filter==='all'||r.status===filter);
  if(state.activeTab==='reviews') countLabel.textContent=`${state.reviews.length} recenzii în total`;
  if(!items.length){reviewsEl.innerHTML='<div class="empty">Nu există recenzii pentru filtrul ales.</div>';return;}
  reviewsEl.innerHTML=items.map(r=>`<article class="card">
    <div class="top"><div><div class="spec">${escapeHtml(r.specialty)}</div><div class="date">${dateText(r.createdAt)}</div></div><span class="status ${escapeHtml(r.status)}">${escapeHtml(r.status)}</span></div>
    <div class="score"><span><b>${r.generalRating}/5</b> ${stars(r.generalRating)}</span><span>Personal: ${r.staffRating||'-'}/5</span><span>Așteptare: ${r.waitRating||'-'}/5</span><span>Curățenie: ${r.cleanRating||'-'}/5</span></div>
    <div class="comment">${r.comment?`„${escapeHtml(r.comment)}”`:'Fără comentariu scris.'}</div>
    <div class="contact">Recomandare: ${escapeHtml(r.recommend||'-')}<br>Email: ${escapeHtml(r.patientEmail||'-')}<br>Telefon: ${escapeHtml(r.patientPhone||'-')}<br>Filtru: ${escapeHtml((r.moderationReasons||[]).join(', ')||'-')}</div>
    <div class="actions">
      ${r.status!=='approved'?`<button class="ok" data-action="approve" data-id="${r.id}" type="button">Aprobă</button>`:''}
      ${r.status!=='rejected'?`<button class="secondary" data-action="reject" data-id="${r.id}" type="button">Respinge</button>`:''}
      <button data-action="delete" data-id="${r.id}" type="button">Șterge</button>
    </div>
  </article>`).join('');
}

async function load(){
  const data=await api('/api/reviews/admin');
  state.reviews=data.reviews||[];
  render();
}

async function loginNow(){
  const passwordValue=password.value.trim();
  if(!passwordValue){showLoginError('Introduceți parola.');return;}
  try{
    const session=await loginApi(passwordValue);
    state.token=session.token;
    localStorage.setItem('mmcAdminToken',state.token);
    localStorage.removeItem('mmcAdminPassword');
    password.value='';
    await load();
    login.style.display='none';
    app.style.display='block';
    setTab(state.activeTab);
  }catch(err){showLoginError(err.message);}
}

function renderAttachments(){
  if(!state.attachments.length){attachmentList.textContent='Maximum 5 fișiere, 8 MB total.';return;}
  attachmentList.innerHTML=state.attachments.map(file=>`<span>${escapeHtml(file.filename)} (${Math.ceil(file.size/1024)} KB)</span>`).join('');
}

function readFileAsBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
    reader.onerror=()=>reject(new Error('Nu am putut citi atașamentul.'));
    reader.readAsDataURL(file);
  });
}

async function loadAttachments(){
  resetEmailMessages();
  const files=Array.from(emailAttachments.files||[]);
  const total=files.reduce((sum,file)=>sum+file.size,0);
  if(files.length>5){emailAttachments.value='';state.attachments=[];renderAttachments();showEmailMessage(emailError,'Puteți atașa maximum 5 fișiere.');return;}
  if(total>8*1024*1024){emailAttachments.value='';state.attachments=[];renderAttachments();showEmailMessage(emailError,'Atașamentele depășesc limita totală de 8 MB.');return;}
  state.attachments=await Promise.all(files.map(async file=>({filename:file.name,size:file.size,content:await readFileAsBase64(file)})));
  renderAttachments();
}

async function sendEmail(event){
  event.preventDefault();
  resetEmailMessages();
  const btn=document.getElementById('sendEmailBtn');
  btn.disabled=true;
  try{
    const payload={
      from:document.getElementById('emailFrom').value,
      to:document.getElementById('emailTo').value,
      cc:document.getElementById('emailCc').value,
      bcc:document.getElementById('emailBcc').value,
      subject:document.getElementById('emailSubject').value,
      html:emailEditor.innerHTML,
      text:emailEditor.innerText,
      attachments:state.attachments.map(({filename,content})=>({filename,content}))
    };
    await api('/api/reviews/admin/email/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    showEmailMessage(emailNotice,'Email trimis.');
  }catch(err){
    showEmailMessage(emailError,err.message);
  }finally{
    btn.disabled=false;
  }
}

document.getElementById('loginBtn').addEventListener('click',loginNow);
password.addEventListener('keydown',event=>{if(event.key==='Enter')loginNow();});
document.getElementById('logoutBtn').addEventListener('click',()=>{localStorage.removeItem('mmcAdminToken');localStorage.removeItem('mmcAdminPassword');location.reload();});
document.getElementById('refreshBtn').addEventListener('click',load);
statusFilter.addEventListener('change',render);
emailAttachments.addEventListener('change',loadAttachments);
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>setTab(btn.dataset.tab)));
document.querySelector('.toolbar-editor').addEventListener('click',event=>{
  const btn=event.target.closest('button[data-command]');
  if(!btn)return;
  emailEditor.focus();
  if(btn.dataset.command==='createLink'){
    const url=prompt('Link');
    if(url) document.execCommand('createLink',false,url);
    return;
  }
  document.execCommand(btn.dataset.command,false,null);
});
document.getElementById('clearEmailBtn').addEventListener('click',()=>{
  emailForm.reset();
  emailEditor.innerHTML='';
  state.attachments=[];
  renderAttachments();
  resetEmailMessages();
});
emailForm.addEventListener('submit',sendEmail);
reviewsEl.addEventListener('click',async event=>{
  const btn=event.target.closest('button[data-action]');
  if(!btn)return;
  if(btn.dataset.action==='delete'&&!confirm('Ștergi definitiv această recenzie?'))return;
  btn.disabled=true;
  try{await api(`/api/reviews/admin/${btn.dataset.id}/${btn.dataset.action}`,{method:'POST'});await load();}
  catch(err){alert(err.message);btn.disabled=false;}
});

if(state.token){load().then(()=>{login.style.display='none';app.style.display='block';setTab(state.activeTab);}).catch(()=>{localStorage.removeItem('mmcAdminToken');});}
</script>
</body>
</html>
